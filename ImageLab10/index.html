<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      
      <a-assets>
        <img id="sky" src="Assets/sky.jpg" alt="" >
        <img id="sand" src="Assets/sand.jpg" alt="" >
        <img id="towel" src="Assets/towel.jpg" alt="">
      </a-assets>
      <a-sky src="#sky"></a-sky>
      <!-- <a-sky src="Assets/sky.jpg"></a-sky> -->

      <a-box src="#towel" height=".01" width="2" length="2" position="-.5 0.1 -3" rotation="0 90 0"></a-box>
      <a-sphere position="0 1.25 -5" radius=".75" color="#EF2D5E"></a-sphere>
      <a-plane src="#sand" position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#CBBD93"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
    </a-scene>
  </body>
</html>
