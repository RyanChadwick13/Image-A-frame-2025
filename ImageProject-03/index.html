<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>

      <a-assets>
        <img id="sky" src="Assets/sky.jpg" alt="" >
        <img id="planet1" src="Assets/planet1.jpg" alt="" >
        <img id="planet2" src="Assets/planet2.jpg" alt="" >
        <img id="planet3" src="Assets/planet3.jpg" alt="" >
        <img id="planet4" src="Assets/planet4.jpg" alt="" >
        <img id="sand" src="Assets/sand.jpg" alt="" >
      </a-assets>
      <a-sky src="#sky"></a-sky>

      <a-sphere src="#planet1" position="-5 15 -5" radius="2.25" ></a-sphere>
      <a-sphere src="#planet2" position="-5 10 1" radius="1.25" ></a-sphere>
      <a-sphere src="#planet3" position="4 20 8" radius="4.25" ></a-sphere>
      <a-sphere src="#planet4" position="-10 12 -1" radius="3.25" ></a-sphere>
    </a-scene>
  </body>
</html>
